name: Run Checks, Vitest and Upload Code Coverage

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (tsc + biome)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Type check and lint
        run: bun run check

  test:
    name: vitest-codecov (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Node is what users run the generator with, so it is the primary target.
          - runtime: node 22
            node-version: 22
            command: node node_modules/vitest/vitest.mjs run
          - runtime: node 24
            node-version: 24
            command: node node_modules/vitest/vitest.mjs run
            upload-coverage: true
          # The package manager and dev runtime of the repo. `--bun` forces the Bun runtime,
          # whereas a plain `bunx vitest run` hands over to Node because of vitest's shebang.
          - runtime: bun
            node-version: 24
            command: bun --bun vitest run
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Print runtime versions
        run: |
          node --version
          bun --version

      # The whole suite, including the e2e tests that type-check the generated output.
      - name: Run Vitest
        run: ${{ matrix.command }}

      - name: Upload coverage to Codecov
        if: ${{ matrix.upload-coverage }}
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  e2e:
    name: e2e type-check (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # Runs the schema fixtures through the generator under Node, then type-checks
      # the schema files together with the generated main.ts, preload.ts and window.d.ts.
      # Coverage is off, because the thresholds apply to the whole suite, not to this subset.
      - name: Run e2e tests
        run: node node_modules/vitest/vitest.mjs run tests/test_e2e --coverage.enabled=false

  electron:
    name: electron integration (node 24)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # bun install does not run the postinstall script of electron, which downloads the binary.
      - name: Install the Electron binary
        run: node node_modules/electron/install.js

      - name: Install xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb

      # Runs the generated bindings in a real Electron process, with hidden sandboxed windows,
      # under xvfb-run since the runner has no display. REQUIRE_ELECTRON makes the tests fail
      # instead of skip when the binary or the display is missing. ELECTRON_NO_SANDBOX turns off
      # the sandbox helper of Chromium, which the runner's kernel does not allow; the windows
      # still use sandbox: true. Coverage is off, because the thresholds apply to the whole suite.
      - name: Run Electron tests
        env:
          REQUIRE_ELECTRON: "1"
          ELECTRON_NO_SANDBOX: "1"
        run: bun run test:electron
