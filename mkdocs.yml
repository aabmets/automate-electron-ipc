site_name: Automate Electron IPC
site_description: Node library for generating IPC components for Electron apps.
site_url: https://aabmets.github.io/automate-electron-ipc/
repo_url: https://github.com/aabmets/automate-electron-ipc
repo_name: aabmets/automate-electron-ipc
copyright: Copyright &copy; Mattias Aabmets

validation:
  links:
    anchors: warn
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.sections
    - content.code.copy
    - search.highlight

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started:
    - Overview: getting-started/index.md
    - "Installation": getting-started/installation.md
    - "Quickstart": getting-started/quickstart.md
    - "Channel maps": getting-started/channel-maps.md
    - "Simple example": getting-started/simple-example.md
  - Tooling:
    - Overview: tooling/index.md
    - "Configuration": tooling/configuration.md
    - "Command line": tooling/command-line.md
    - "Node API": tooling/node-api.md
    - "Vite and electron-vite": tooling/vite.md
    - "TypeScript configuration": tooling/typescript-configuration.md
    - "Generated files": tooling/generated-files.md
    - "Preload bundling and the sandbox": tooling/preload-bundling.md
    - "electron-vite end to end": tooling/electron-vite.md
  - Schema:
    - Overview: schema/index.md
    - "Verbs": schema/verbs.md
    - "The generated API": schema/generated-api.md
    - "What can be sent": schema/what-can-be-sent.md
    - "Custom serializers": schema/custom-serializers.md
    - "The `as` form": schema/as-form.md
  - Channels:
    - Overview: channels/index.md
    - "invoke": channels/invoke.md
    - "send": channels/send.md
